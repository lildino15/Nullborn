name: TheNullborn
options:
  bundleIdPrefix: com.nullborn
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TheNullborn:
    type: application
    platform: iOS
    sources:
      - path: TheNullborn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullborn.game
        PRODUCT_NAME: The Nullborn
        INFOPLIST_KEY_CFBundleDisplayName: The Nullborn
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
