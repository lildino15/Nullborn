<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#151027"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/theme.css"><title>The Nullborn | Final Chapter</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#3a2453,#090c18 72%);color:#f3eafa;font:16px system-ui}main{max-width:660px;margin:auto;padding:26px 18px 70px}h1,h2{font-family:Georgia,serif}h1{font-size:36px}.panel{background:#171a30;border:1px solid #70568f;border-radius:20px;padding:24px;margin:18px 0}p{line-height:1.7}.muted{color:#bcb2d1}button,a{display:block;width:100%;padding:14px;margin:12px 0;border-radius:12px;background:#604486;border:1px solid #b193d8;color:white;text-align:center;text-decoration:none;font:inherit;cursor:pointer}input{width:100%;padding:13px;background:#26243d;border:1px solid #765e94;color:white;border-radius:9px;margin:6px 0}.art{font-size:68px;text-align:center;padding:25px;background:radial-gradient(circle,#7653a4,#25213c 60%,#16182a);border-radius:16px}blockquote{border-left:3px solid #ac8ade;padding-left:14px;color:#dcc7f6}</style><link rel="stylesheet" href="/illustrated-world.css"></head><body><main><header class="nb-top"><a class="nb-brand" href="/adventure.html"><span class="nb-mark">✧</span> THE NULLBORN</a><nav><a href="/adventure.html">Adventure</a><a href="/common.html">Dungeon</a><a href="/party.html">Guild</a><a href="/character.html">Hero</a></nav></header><small>THE NULLBORN · END OF THE FIRST ARC</small><h1>The Last Door</h1><p class="muted">Chapter Four · A choice that will echo through Elyndra.</p><section id="login" class="panel"><h2>Adventurer Sign In</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button></section><section id="scene" class="panel" hidden></section><p id="msg" role="status"></p><a href="/tactics.html">⚔️ Three Guardians tactical battle</a><a href="/skills.html">✨ Skill Hall</a><a href="/">← Main game</a></main><script>const $=x=>document.getElementById(x);async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function draw(d){$('login').hidden=true;$('scene').hidden=false;const s=$('scene');s.replaceChildren();let art=document.createElement('div');art.className='art';art.textContent=d.finale.completed?'🌌':d.finale.stage==='trial'?'⚔️':'🚪';s.append(art);let h=document.createElement('h2');h.textContent=d.scene.title;s.append(h);let p=document.createElement('p');p.textContent=d.scene.text;s.append(p);let q=document.createElement('blockquote');q.textContent=d.voice+': “Our choices are the only history they cannot erase.”';s.append(q);for(let [key,label] of d.scene.options){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{draw(await api('/api/finale',{choice:key}));$('msg').textContent='Chronicle saved.'}catch(e){$('msg').textContent=e.message;b.disabled=false}};s.append(b)}let m=document.createElement('p');m.className='muted';m.textContent='Lyra bond: '+d.lyraBond+' · Tactical victory: '+(d.tacticalVictory?'Yes':'Not yet')+' · Fallen beasts: '+(d.fallen.join(', ')||'none');s.append(m);if(d.finale.completed){let end=document.createElement('h2');end.textContent='Ending: '+d.finale.ending;s.append(end);let note=document.createElement('p');note.textContent='Three training points awarded once. Your adventure continues beyond the first arc.';s.append(note)}}$('signin').onclick=async()=>{try{await api('/api/auth/login',{email:$('email').value,password:$('password').value});draw(await api('/api/finale'))}catch(e){$('msg').textContent=e.message}};api('/api/auth/me').then(d=>{if(d.user)return api('/api/finale').then(draw)}).catch(()=>{});</script><nav class="nb-bottom" aria-label="Main navigation"><a href="/adventure.html"><span>⌂</span>Story</a><a href="/common.html"><span>⚔</span>Dungeon</a><a href="/party.html"><span>♜</span>Guild</a><a href="/character.html"><span>✦</span>Hero</a><a href="/skills.html"><span>✧</span>Skills</a></nav></body><script src="/audio.js" defer></script><script src="/install.js" defer></script></html>
