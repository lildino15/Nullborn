services:
  - type: web
    name: nullborn-private-playtest
    runtime: node
    plan: free
    rootDir: game
    buildCommand: echo "no install needed - pg is only imported when DATABASE_URL is set"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
