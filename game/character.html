<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151027"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/illustrated-world.css"><link rel="stylesheet" href="/sprite-effects.css"><title>The Nullborn | Character</title><style>body{background:radial-gradient(ellipse at top,#302443,#0b1020);color:#f3eafd;font:16px system-ui;margin:0}main{max-width:740px;margin:auto;padding:24px 18px 90px}h1,h2{font-family:Georgia,serif}.card{border:1px solid #6c598a;background:#1b1b31;border-radius:18px;padding:18px;margin:15px 0}a,button{color:white;background:#514077;border:1px solid #a58ac8;border-radius:10px;padding:12px 16px;text-decoration:none;font:inherit;margin:4px;min-height:44px}button:disabled{opacity:.4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #514665;padding:8px 0}small{color:#c4b8d8}</style><main><div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:12px;background:linear-gradient(135deg,#202747,#2c2447);border-radius:16px;margin:10px 0"><img src="/sprites/hero.svg" alt="Original fantasy hero portrait" width="88" height="88"><div><strong>Hero Hall</strong><p style="margin:5px 0;color:#c9bfdc">Adventurers of Elyndra</p></div></div><header class="nb-top"><a class="nb-brand" href="/adventure.html"><span class="nb-mark">✧</span> THE NULLBORN</a><nav><a href="/adventure.html">Adventure</a><a href="/common.html">Dungeon</a><a href="/party.html">Guild</a><a href="/character.html">Hero</a></nav></header><a href="/adventure.html">← Adventure Hub</a><h1>⚔️ Adventurer's Ledger</h1><p id="status" role="status">Loading saved character…</p><section class="card"><h2>Attributes</h2><div id="stats"></div></section><section class="card"><h2>Equipment & Inventory</h2><div id="items"></div></section><section class="card"><h2>Companions</h2><div id="party"></div><a href="/beasts.html">Manage beasts →</a></section><section class="card"><h2>Training</h2><a href="/skills.html">Swap and upgrade skills →</a></section></main><script>const el=id=>document.getElementById(id);let data;async function load(){try{const r=await fetch('/api/hero-profile',{credentials:'same-origin'});data=await r.json();if(!r.ok)throw Error(data.error||'Sign in first from the main game');draw()}catch(e){el('status').textContent=e.message}}function draw(){const h=data.hero;el('status').textContent=`Level ${h.level} · ${h.xp}/${h.level*50} XP · ${h.statPoints} attribute points · ${data.gold} gold`;el('stats').replaceChildren();for(const [name,key] of [['Might','might'],['Vitality','vitality'],['Focus','focus']]){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=`${name}: ${h[key]||0}`;const btn=document.createElement('button');btn.textContent='+ Upgrade';btn.disabled=!h.statPoints;btn.onclick=()=>train(key);row.append(label,btn);el('stats').append(row)}el('items').replaceChildren();const eq=document.createElement('p');eq.textContent='Weapons: '+(data.weapons.length?data.weapons.map(w=>`${w.name||'Weapon'}${w.id===data.equippedId?' [equipped]':''}`).join(', '):'Starter equipment');el('items').append(eq);const m=document.createElement('p');m.textContent='Materials: '+(Object.entries(data.materials).map(([k,v])=>`${k} ×${v}`).join(' · ')||'None yet');el('items').append(m);el('party').textContent=`Lyra friendship: ${data.lyraBond} · Living beasts: ${data.companions.map(b=>b.kind).join(', ')||'None'} · Memorial: ${data.memorial.length}`}async function train(stat){try{const r=await fetch('/api/hero-profile',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'train',stat})});const d=await r.json();if(!r.ok)throw Error(d.error);data=d;draw();window.NullbornAudio?.effect('victory')}catch(e){el('status').textContent=e.message}}load();</script><script src="/audio.js" defer></script><script src="/install.js" defer></script><nav class="nb-bottom" aria-label="Main navigation"><a href="/adventure.html"><span>⌂</span>Story</a><a href="/common.html"><span>⚔</span>Dungeon</a><a href="/party.html"><span>♜</span>Guild</a><a href="/character.html"><span>✦</span>Hero</a><a href="/skills.html"><span>✧</span>Skills</a></nav></html>
